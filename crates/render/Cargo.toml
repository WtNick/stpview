[package]
name = "stpview"
description = "A CAD rendering library: import STEP models, compose scenes, render them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stpview-core = { path = "../core" }
bytemuck.workspace = true
pollster = "1.0.1"
rayon = "1.12.0"
wgpu = "30.0.0"

# Only the contact-sheet example writes PNGs; the library returns raw RGBA.
[dev-dependencies]
png = "0.18.1"
