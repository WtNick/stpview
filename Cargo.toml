# The CPU side (stpview-core) and the GPU side (stpview) are separate crates so
# importing and tessellating never depends on wgpu.
[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/app", "crates/shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/WtNick/stpview"

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
# One version of the Windows bindings: the shell crate implements the COM
# interfaces and the app registers them. `windows-core` is named directly
# because the `implement` macro generates `windows_core::` paths.
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
